[package]
name = "flexmeme"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.7.0"
clipboard-win = "5.4.1"
dirs = "7.0.0"
enigo = "0.6.1"
global-hotkey = "0.9.0"
image = "0.25.10"
raw-window-handle = "0.6.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
slint = { version = "1.x", features = ["raw-window-handle-06"] }
uiautomation = { version = "0.25.1", features = ["event"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.16.1"
